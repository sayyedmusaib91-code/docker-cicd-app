name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t my-cicd-app .

    - name: Run Test Container
      run: docker run -d -p 3000:3000 my-cicd-app