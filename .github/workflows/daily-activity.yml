name: Daily Activity Update

on:
  schedule:
    # 18:36 UTC = 12:06 AM IST daily
    - cron: '36 18 * * *'
  workflow_dispatch:

jobs:
  update-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Append daily log
        run: |
          mkdir -p logs
          echo "Activity on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> logs/activity.txt

      - name: Commit and push as user
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "sayyedmusaib91-code"
          git config user.email "286221917+sayyedmusaib91-code@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git add logs/activity.txt
          git commit -m "Daily activity log" || exit 0
          git push
