name: Daily Activity Update

on:
  schedule:
    # 18:40 UTC = 12:10 AM IST daily
    - cron: '40 18 * * *'
  workflow_dispatch:

jobs:
  update-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git and push 2 daily commits
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p logs
          git config user.name "sayyedmusaib91-code"
          git config user.email "286221917+sayyedmusaib91-code@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          echo "Daily commit #1 on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> logs/daily-1.txt
          git add logs/daily-1.txt
          git commit -m "Daily activity log #1" || exit 0
          git push

          git pull --rebase origin main
          echo "Daily commit #2 on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> logs/daily-2.txt
          git add logs/daily-2.txt
          git commit -m "Daily activity log #2" || exit 0
          git push
